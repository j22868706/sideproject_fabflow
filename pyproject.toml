[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabflow"
version = "0.1.0"
description = "A synthetic semiconductor fab dispatching and AMHS digital twin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
fabflow = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["app", "simulator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"