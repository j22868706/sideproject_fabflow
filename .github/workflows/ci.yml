name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=app --cov=simulator --cov-report=term-missing

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Verify container HTTP workflows
        run: docker compose exec -T dashboard python - < scripts/smoke_containers.py

      - name: Set up Python for browser acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser acceptance dependencies
        run: |
          python -m pip install ".[browser]"
          python -m playwright install --with-deps chromium

      - name: Verify dashboard in Chromium
        run: python scripts/smoke_browser.py

      - name: Upload browser screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: artifacts/browser/
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down
