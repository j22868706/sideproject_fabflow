services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      FABFLOW_RUN_STORE: postgres
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: fabflow
      PGUSER: fabflow
      PGPASSWORD: ${POSTGRES_PASSWORD:?please set up your password at .env}

  dashboard:
    build:
      context: .
      target: dashboard
    environment:
      FABFLOW_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fabflow
      POSTGRES_USER: fabflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?please set up your password at .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
