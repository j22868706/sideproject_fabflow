apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fabflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fabflow-api
  template:
    metadata:
      labels:
        app: fabflow-api
    spec:
      containers:
        - name: api
          image: fabflow-api:day4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fabflow
spec:
  type: ClusterIP
  selector:
    app: fabflow-api
  ports:
    - name: http
      port: 8000
      targetPort: http
