apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: fabflow
data:
  FABFLOW_API_URL: http://api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fabflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fabflow-dashboard
  template:
    metadata:
      labels:
        app: fabflow-dashboard
    spec:
      containers:
        - name: dashboard
          image: fabflow-dashboard:day5
          imagePullPolicy: IfNotPresent
          env:
            - name: FABFLOW_API_URL
              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: FABFLOW_API_URL
          ports:
            - name: http
              containerPort: 8501
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fabflow
spec:
  type: ClusterIP
  selector:
    app: fabflow-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http
